name: Deploy visualizer

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC only; no long-lived AWS keys are stored in this repo.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-visualizer
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm

      - run: npm ci

      # Also runs scripts/check-public-data.mjs, which refuses to build unless
      # the bundled fixture is the synthetic DEMO / 0000000 data. A deploy can
      # therefore never ship a real codeplug.
      - run: npm run build

      # Hashed filenames, so these can be cached indefinitely.
      - name: Sync hashed assets
        run: |
          aws s3 sync dist/ "s3://${{ vars.BUCKET }}" \
            --delete \
            --exclude '*' --include 'assets/*' \
            --cache-control 'public, max-age=31536000, immutable'

      # Everything else, index.html included, must revalidate or a stale shell
      # will keep pointing at deleted asset hashes.
      - name: Sync everything else
        run: |
          aws s3 sync dist/ "s3://${{ vars.BUCKET }}" \
            --delete \
            --exclude 'assets/*' \
            --cache-control 'no-cache'

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" --id "$id"
